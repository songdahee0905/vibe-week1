<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바이브 코딩 2주차 실습</title>
<style>
  :root {
    --dongduk-pink: #e6007e;
    --dongduk-pink-dark: #b8005f;
    --dongduk-pink-light: #ffe6f2;
    --text-dark: #2b2b2b;
    --text-gray: #6b6b6b;
    --bg: #fffafc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    line-height: 1.6;
  }

  header {
    background: linear-gradient(135deg, var(--dongduk-pink) 0%, var(--dongduk-pink-dark) 100%);
    color: #fff;
    padding: 60px 20px 70px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: "";
    position: absolute;
    bottom: -40px;
    left: 0;
    right: 0;
    height: 80px;
    background: var(--bg);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    margin-bottom: 16px;
  }

  header h1 {
    font-size: 2.4rem;
    font-weight: 800;
    margin-bottom: 12px;
  }

  header p {
    font-size: 1.05rem;
    opacity: 0.92;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 24px 80px;
  }

  .toc {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 60px;
  }

  .toc a {
    display: block;
    background: #fff;
    border: 1.5px solid var(--dongduk-pink-light);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    text-decoration: none;
    color: var(--dongduk-pink-dark);
    font-weight: 700;
    font-size: 0.95rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .toc a:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(230, 0, 126, 0.15);
    background: var(--dongduk-pink-light);
  }

  .toc a .num {
    display: block;
    font-size: 1.6rem;
    margin-bottom: 6px;
  }

  section {
    background: #fff;
    border-radius: 18px;
    padding: 32px 28px;
    margin-bottom: 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    border-left: 6px solid var(--dongduk-pink);
    scroll-margin-top: 20px;
  }

  section h2 {
    color: var(--dongduk-pink-dark);
    font-size: 1.4rem;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  section h2 .step {
    background: var(--dongduk-pink);
    color: #fff;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    flex-shrink: 0;
  }

  section p, section li {
    color: var(--text-gray);
    font-size: 0.98rem;
  }

  section ul {
    padding-left: 1.2em;
    margin-top: 8px;
  }

  section li { margin-bottom: 6px; }

  .placeholder {
    color: #c0c0c0;
    font-style: italic;
  }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-gray);
    font-size: 0.85rem;
    border-top: 1px solid var(--dongduk-pink-light);
  }

  footer .school {
    color: var(--dongduk-pink-dark);
    font-weight: 700;
  }
</style>
</head>
<body>

<header>
  <span class="badge">DONGDUK WOMEN'S UNIVERSITY</span>
  <h1>바이브 코딩 2주차 실습</h1>
  <p>실습 과정을 한눈에 확인할 수 있는 안내 페이지입니다</p>
</header>

<main>
  <nav class="toc">
    <a href="#overview"><span class="num">1</span>실습 개요</a>
    <a href="#prepare"><span class="num">2</span>사전 준비</a>
    <a href="#content"><span class="num">3</span>실습 내용</a>
    <a href="#summary"><span class="num">4</span>결과 정리</a>
  </nav>

  <section id="overview">
    <h2><span class="step">1</span>실습 개요</h2>
    <p class="placeholder">이번 실습의 목표와 개요를 이곳에 작성하세요.</p>
  </section>

  <section id="prepare">
    <h2><span class="step">2</span>사전 준비</h2>
    <p class="placeholder">실습 전에 필요한 준비물, 설치 프로그램, 사전 지식 등을 이곳에 작성하세요.</p>
  </section>

  <section id="content">
    <h2><span class="step">3</span>실습 내용</h2>
    <p class="placeholder">실습의 단계별 과정을 이곳에 작성하세요.</p>
  </section>

  <section id="summary">
    <h2><span class="step">4</span>결과 정리</h2>
    <p class="placeholder">실습을 통해 얻은 결과와 배운 점을 이곳에 작성하세요.</p>
  </section>
</main>

<footer>
  <p><span class="school">동덕여자대학교</span> · 바이브 코딩 2주차 실습</p>
</footer>

</body>
</html>
