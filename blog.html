<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실습 블로그 · 바이브 코딩 2주차</title>
<style>
  :root {
    --dongduk-pink: #e6007e;
    --dongduk-pink-dark: #b8005f;
    --dongduk-pink-light: #ffe6f2;
    --text-dark: #2b2b2b;
    --text-gray: #6b6b6b;
    --bg: #fffafc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    line-height: 1.6;
  }

  header {
    background: linear-gradient(135deg, var(--dongduk-pink) 0%, var(--dongduk-pink-dark) 100%);
    color: #fff;
    padding: 60px 20px 70px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: "";
    position: absolute;
    bottom: -40px;
    left: 0;
    right: 0;
    height: 80px;
    background: var(--bg);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    margin-bottom: 16px;
  }

  header h1 {
    font-size: 2.2rem;
    font-weight: 800;
    margin-bottom: 12px;
  }

  header p {
    font-size: 1.05rem;
    opacity: 0.92;
  }

  nav.top-nav {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 24px 0;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  nav.top-nav a {
    text-decoration: none;
    color: var(--dongduk-pink-dark);
    font-weight: 700;
    font-size: 0.9rem;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--dongduk-pink-light);
    background: #fff;
    transition: background 0.15s ease;
  }

  nav.top-nav a:hover {
    background: var(--dongduk-pink-light);
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 24px 80px;
  }

  .post-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .post-card {
    background: #fff;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    border-left: 6px solid var(--dongduk-pink);
  }

  .post-card .date {
    display: inline-block;
    background: var(--dongduk-pink-light);
    color: var(--dongduk-pink-dark);
    font-size: 0.8rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }

  .post-card h2 {
    font-size: 1.25rem;
    color: var(--text-dark);
    margin-bottom: 10px;
  }

  .post-card p {
    color: var(--text-gray);
    font-size: 0.95rem;
  }

  .post-card .placeholder {
    color: #c0c0c0;
    font-style: italic;
  }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-gray);
    font-size: 0.85rem;
    border-top: 1px solid var(--dongduk-pink-light);
  }

  footer .school {
    color: var(--dongduk-pink-dark);
    font-weight: 700;
  }
</style>
</head>
<body>

<header>
  <span class="badge">DONGDUK WOMEN'S UNIVERSITY</span>
  <h1>실습 블로그</h1>
  <p>바이브 코딩 2주차 실습 과정과 기록을 남기는 공간입니다</p>
</header>

<nav class="top-nav">
  <a href="index.html">메인으로</a>
</nav>

<main>
  <div class="post-list">

    <article class="post-card">
      <span class="date">YYYY.MM.DD</span>
      <h2 class="placeholder">글 제목을 입력하세요</h2>
      <p class="placeholder">이곳에 실습 첫째 날 기록이나 배운 내용을 작성하세요.</p>
    </article>

    <article class="post-card">
      <span class="date">YYYY.MM.DD</span>
      <h2 class="placeholder">글 제목을 입력하세요</h2>
      <p class="placeholder">이곳에 실습 진행 중 겪은 시행착오와 해결 과정을 작성하세요.</p>
    </article>

    <article class="post-card">
      <span class="date">YYYY.MM.DD</span>
      <h2 class="placeholder">글 제목을 입력하세요</h2>
      <p class="placeholder">이곳에 실습을 마친 후 느낀 점과 결과를 작성하세요.</p>
    </article>

  </div>
</main>

<footer>
  <p><span class="school">동덕여자대학교</span> · 바이브 코딩 2주차 실습</p>
</footer>

</body>
</html>
