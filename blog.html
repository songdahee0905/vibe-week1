<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>송다희의 블로그</title>
<style>
  :root {
    --pink-1: #d81e4f;
    --pink-2: #9c1042;
    --pink-3: #6b0b2e;
    --pink-4: #3d0619;
    --pink-light: #f7dde3;
    --pink-glow: #e79bab;
    --text-dark: #301017;
    --text-gray: #7a5a5f;
    --bg: #fff8f7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    line-height: 1.7;
    overflow-x: hidden;
  }

  header {
    position: relative;
    background: linear-gradient(120deg, var(--pink-1), var(--pink-2) 45%, var(--pink-3) 100%);
    color: #fff;
    padding: 80px 20px 110px;
    text-align: center;
    overflow: hidden;
  }

  header .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(30px);
    opacity: 0.45;
    animation: float 9s ease-in-out infinite;
  }
  header .blob.b1 { width: 220px; height: 220px; background: #fff; top: -60px; left: -60px; animation-delay: 0s; }
  header .blob.b2 { width: 160px; height: 160px; background: var(--pink-glow); bottom: -40px; right: 5%; animation-delay: 2s; }
  header .blob.b3 { width: 100px; height: 100px; background: #fff; top: 30%; right: 20%; animation-delay: 4s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-18px) scale(1.06); }
  }

  header::after {
    content: "";
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 90px;
    background: var(--bg);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  .badge {
    position: relative;
    z-index: 1;
    display: inline-block;
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(4px);
    padding: 7px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    margin-bottom: 18px;
    border: 1px solid rgba(255,255,255,0.4);
  }

  header h1 {
    position: relative;
    z-index: 1;
    font-size: 2.5rem;
    font-weight: 900;
    margin-bottom: 14px;
    text-shadow: 0 4px 24px rgba(122, 0, 64, 0.35);
  }

  header p {
    position: relative;
    z-index: 1;
    font-size: 1.05rem;
    opacity: 0.95;
  }

  nav.top-nav {
    max-width: 900px;
    margin: 0 auto;
    padding: 22px 24px 0;
    display: flex;
    justify-content: flex-end;
  }

  nav.top-nav a {
    text-decoration: none;
    color: #fff;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 10px 22px;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--pink-2), var(--pink-3));
    box-shadow: 0 8px 20px rgba(156, 16, 66, 0.35);
    transition: transform 0.15s ease;
  }

  nav.top-nav a:hover { transform: translateY(-2px); }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 50px 24px 90px;
  }

  main > p.lead {
    text-align: center;
    color: var(--text-gray);
    font-size: 0.98rem;
    margin-bottom: 34px;
  }

  /* ---------- Entry card (클릭 가능한 실습 시리즈 카드) ---------- */
  .entry-card {
    display: block;
    position: relative;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(6px);
    border-radius: 24px;
    padding: 32px 34px;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--pink-light);
    box-shadow: 0 10px 30px rgba(184, 0, 95, 0.09);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    overflow: hidden;
  }

  .entry-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 8px;
    height: 100%;
    background: linear-gradient(180deg, var(--pink-1), var(--pink-3));
  }

  .entry-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 36px rgba(156, 16, 66, 0.2);
  }

  .entry-card .date {
    display: inline-block;
    background: var(--pink-light);
    color: var(--pink-3);
    font-size: 0.78rem;
    font-weight: 800;
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
    letter-spacing: 0.03em;
  }

  .entry-card h2 {
    font-size: 1.35rem;
    color: var(--pink-4);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .entry-card h2 .go {
    color: var(--pink-2);
    font-size: 1.3rem;
    transition: transform 0.18s ease;
  }

  .entry-card:hover h2 .go { transform: translateX(6px); }

  .entry-card p {
    color: var(--text-gray);
    font-size: 0.96rem;
  }

  .entry-card .tags {
    margin-top: 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .entry-card .tags span {
    background: var(--pink-light);
    color: var(--pink-3);
    font-size: 0.8rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
  }

  footer {
    text-align: center;
    padding: 34px 20px;
    color: var(--text-gray);
    font-size: 0.85rem;
    border-top: 1px solid var(--pink-light);
  }

  footer .school {
    background: linear-gradient(135deg, var(--pink-1), var(--pink-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
  }

  @media (max-width: 640px) {
    header h1 { font-size: 2rem; }
    .entry-card { padding: 26px 22px; }
  }
</style>
</head>
<body>

<header>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <span class="badge">DONGDUK WOMEN'S UNIVERSITY</span>
  <h1>🌹 송다희의 블로그</h1>
  <p>바이브 코딩 실습을 기록하는 공간입니다</p>
</header>

<nav class="top-nav">
  <a href="index.html">🏠 메인으로</a>
</nav>

<main>
  <p class="lead">아래 카드를 눌러 실습 과정과 시행착오를 확인해보세요</p>

  <a class="entry-card" href="summer-vibe-coding.html">
    <span class="date">2026 SUMMER</span>
    <h2>1학기 여름방학 바이브 코딩 실습 <span class="go">➜</span></h2>
    <p>기획부터 배포까지, AI와 함께 웹사이트를 만들며 겪은 실습 과정과 시행착오를 순서대로 기록했습니다.</p>
    <div class="tags">
      <span>#바이브코딩</span>
      <span>#GitHub</span>
      <span>#시행착오</span>
    </div>
  </a>
</main>

<footer>
  <p><span class="school">동덕여자대학교</span> · 바이브 코딩 2주차 실습</p>
</footer>

</body>
</html>
